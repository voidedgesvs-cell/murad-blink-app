name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MURAD-BLINK-Windows-EXE
          path: dist/*.exe
