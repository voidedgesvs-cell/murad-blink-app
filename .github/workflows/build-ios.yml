name: Build iOS Simulator App
on:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx cap add ios
      - run: node scripts/patch_ios.js
      - run: npx cap sync ios
      - name: Build unsigned simulator app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO
      - run: ditto -c -k --sequesterRsrc --keepParent build-ios/Build/Products/Debug-iphonesimulator/App.app MURAD-BLINK-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MURAD-BLINK-iOS-Simulator
          path: MURAD-BLINK-iOS-Simulator.zip
